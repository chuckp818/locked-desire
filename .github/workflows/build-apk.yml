name: KopfFrei – Tests und APK

on:
  push:
    branches: [main, master, kopffrei-phase1]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests ausführen
        shell: bash
        run: ./gradlew :core:common:test testDebugUnitTest --continue --stacktrace 2>&1 | tee build.log
      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: python3 tools/ci_annotate_errors.py build.log "Unit-Tests"
      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'

  apk:
    name: Debug-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug-APK bauen
        shell: bash
        run: ./gradlew :app:assembleDebug --continue --stacktrace 2>&1 | tee build.log
      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: python3 tools/ci_annotate_errors.py build.log "APK-Build"
      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: KopfFrei-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release mit APK (nur bei Tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KopfFrei-debug-apk
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
