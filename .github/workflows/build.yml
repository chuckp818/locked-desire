name: APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Tests und APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log
      - name: Fehlerauszug
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:|FAILED|What went wrong|Unresolved|warning: .*deprecated" -A3 build.log | head -300 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk LockedDesire.apk
      - name: APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: LockedDesire-APK
          path: LockedDesire.apk
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LockedDesire.apk --title "Locked Desire (Build ${{ github.run_number }})" --notes "Automatisch gebaute APK. Datei LockedDesire.apk herunterladen und antippen." --target ${{ github.sha }}
